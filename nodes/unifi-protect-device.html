<link rel="stylesheet" type="text/css"
    href="resources/node-red-contrib-unifi-ultimate/editor/unifi-ultimate-editor-common.css">


<script type="text/javascript">
    RED.nodes.registerType("unifi-protect-device", {
        category: "Unifi Ultimate",
        color: "#7DB7E8",
        defaults: {
            name: { value: "" },
            server: { value: "", type: "unifi-protect-config", required: true },
            deviceType: { value: "", required: true },
            deviceId: { value: "", required: true },
            deviceName: { value: "" },
            inputs: { value: 1 },
            capability: { value: "observe", required: true },
            capabilityConfig: { value: "{}" },
            emitStartupAndUndefined: { value: false },
            autoEmit: { value: false },
            autoEmitInterval: { value: 60, validate: RED.validators.number() }
        },
        inputs: 1,
        outputs: 2,
        icon: "unifi-u-logo-light-protect.svg",
        paletteLabel: "PROTECT",
        outputLabels: ["result", "error"],
        label: function () {
            return this.name || this.deviceId || "Unifi Protect";
        },
        oneditsave: function () {
            const selectedCapabilityId = String($("#node-input-capability").val() || this.capability || "observe").trim();
            const selectedCapabilityOpensStream = $("#node-input-capability option:selected").data("opens-stream") === true
                || $("#node-input-capability option:selected").attr("data-opens-stream") === "true";
            const selectedCapabilityMethod = String($("#node-input-capability option:selected").data("method") || $("#node-input-capability option:selected").attr("data-method") || "").trim().toUpperCase();
            const supportsPeriodicEmit = !selectedCapabilityOpensStream && (!selectedCapabilityMethod || selectedCapabilityMethod === "GET");
            // Hide the input pin only when the selected action starts an event stream.
            this.inputs = (selectedCapabilityOpensStream || selectedCapabilityId === "observe") ? 0 : 1;
            this.autoEmit = supportsPeriodicEmit ? $("#node-input-autoEmit").is(":checked") : false;

            const $capabilityConfig = $("#node-input-capabilityConfig");
            const capabilityConfig = {};
            if ($capabilityConfig.length === 0) {
                this.capabilityConfig = "{}";
                return;
            }

            $("#node-input-capabilityConfigContainer").find("[id^='node-input-capability-config-']").each(function () {
                const $field = $(this);
                const fieldId = String($field.attr("id") || "").replace("node-input-capability-config-", "");
                if (!fieldId) {
                    return;
                }

                if ($field.is(":checkbox")) {
                    capabilityConfig[fieldId] = $field.is(":checked");
                    return;
                }

                if ($field.is("select[multiple]")) {
                    capabilityConfig[fieldId] = $field.val() || [];
                    return;
                }

                capabilityConfig[fieldId] = $field.val();
            });

            const existingValue = String($capabilityConfig.val() || "").trim();
            let parsedExistingValue = {};
            if (existingValue) {
                try {
                    const parsed = JSON.parse(existingValue);
                    parsedExistingValue = parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
                } catch (error) {
                    parsedExistingValue = {};
                }
            }

            this.capabilityConfig = JSON.stringify({
                ...parsedExistingValue,
                ...capabilityConfig
            });
        },
        oneditprepare: function () {
            const node = this;
            const $name = $("#node-input-name");
            const $server = $("#node-input-server");
            const $deviceType = $("#node-input-deviceType");
            const $deviceId = $("#node-input-deviceId");
            const $deviceName = $("#node-input-deviceName");
            const $capability = $("#node-input-capability");
            const $capabilityConfig = $("#node-input-capabilityConfig");
            const $capabilityConfigRow = $("#node-row-capabilityConfig");
            const $capabilityConfigContainer = $("#node-input-capabilityConfigContainer");
            const $autoEmit = $("#node-input-autoEmit");
            const $autoEmitRow = $("#node-row-autoEmit");
            const $autoEmitIntervalRow = $("#node-row-autoEmitInterval");
            const $refresh = $("#node-input-refreshDevices");
            const $deviceTypeRow = $deviceType.closest(".form-row");
            const $deviceIdRow = $deviceId.closest(".form-row");
            const $capabilityRow = $capability.closest(".form-row");
            const $advancedRow = $("#node-row-advanced");
            let capabilityConfig = parseCapabilityConfig(node.capabilityConfig);
            let deviceListRequestId = 0;
            let capabilityListRequestId = 0;
            let capabilityOptionsRequestId = 0;
            let suspendChangeHandling = false;
            let isInitializingEditor = true;
            let restoredPersistedAutoEmit = false;
            let preserveSavedDeviceSelection = true;
            let deviceTypeDefinitions = [];
            let capabilityDefinitions = [];

            function hasSelection($field) {
                const value = String($field.val() || "").trim();
                return value !== "" && value !== "_ADD_";
            }

            function syncProgressiveRows() {
                const hasServer = hasSelection($server);
                const hasDeviceType = hasSelection($deviceType);
                const hasDevice = hasSelection($deviceId);
                const hasCapability = hasSelection($capability);
                const hasCapabilityFields = $capabilityConfigRow.data("has-fields") === true;
                const capabilityDefinition = getSelectedCapabilityDefinition();
                const capabilityMethod = String(capabilityDefinition && capabilityDefinition.method || "").trim().toUpperCase();
                const supportsPeriodicEmit = capabilityDefinition
                    && capabilityDefinition.opensEventStream !== true
                    && (!capabilityMethod || capabilityMethod === "GET");
                const showPeriodicEmit = Boolean(hasServer && hasDeviceType && hasDevice && hasCapability && supportsPeriodicEmit);

                $deviceTypeRow.toggle(hasServer);
                $deviceIdRow.toggle(hasServer && hasDeviceType);
                $capabilityRow.toggle(hasServer && hasDeviceType && hasDevice);
                $capabilityConfigRow.toggle(hasServer && hasDeviceType && hasDevice && hasCapability && hasCapabilityFields);
                $advancedRow.toggle(hasServer && hasDeviceType && hasDevice && hasCapability);
                $autoEmitRow.toggle(showPeriodicEmit);
                $autoEmitIntervalRow.toggle(showPeriodicEmit && $autoEmit.is(":checked"));

                if (showPeriodicEmit && !restoredPersistedAutoEmit) {
                    $autoEmit.prop("checked", node.autoEmit === true || node.autoEmit === "true");
                    restoredPersistedAutoEmit = true;
                    $autoEmitIntervalRow.toggle($autoEmit.is(":checked"));
                }

                if (!showPeriodicEmit && !isInitializingEditor) {
                    $autoEmit.prop("checked", false);
                }
            }

            function parseCapabilityConfig(rawValue) {
                if (rawValue && typeof rawValue === "object" && !Array.isArray(rawValue)) {
                    return rawValue;
                }

                if (typeof rawValue !== "string" || rawValue.trim() === "") {
                    return {};
                }

                try {
                    const parsed = JSON.parse(rawValue);
                    return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
                } catch (error) {
                    return {};
                }
            }

            function writeCapabilityConfig() {
                $capabilityConfig.val(JSON.stringify(capabilityConfig || {}));
            }

            function withSuppressedChanges(callback) {
                suspendChangeHandling = true;
                try {
                    return callback();
                } finally {
                    suspendChangeHandling = false;
                }
            }

            function getCurrentOrNodeValue($input, nodeValue, fallbackValue) {
                const currentValue = String($input.val() || "").trim();
                if (currentValue !== "") {
                    return currentValue;
                }

                const persistedValue = String(nodeValue || "").trim();
                if (persistedValue !== "") {
                    return persistedValue;
                }

                return String(fallbackValue || "").trim();
            }

            function requestJson(url) {
                return new Promise(function (resolve, reject) {
                    $.getJSON(url, function (data) {
                        resolve(data);
                    }).fail(function (xhr) {
                        reject(xhr);
                    });
                });
            }

            function getConfigNodesByType(configType) {
                const configs = [];
                try {
                    if (RED && RED.nodes) {
                        // Read config nodes directly from the editor registry so
                        // new nodes can immediately bind to an existing connection.
                        if (typeof RED.nodes.eachConfig === "function") {
                            RED.nodes.eachConfig(function (cfg) {
                                if (cfg && cfg.type === configType) {
                                    configs.push(cfg);
                                }
                            });
                        } else if (typeof RED.nodes.eachNode === "function") {
                            RED.nodes.eachNode(function (cfg) {
                                if (cfg && cfg.type === configType) {
                                    configs.push(cfg);
                                }
                            });
                        }

                        if (configs.length === 0 && typeof RED.nodes.filterNodes === "function") {
                            try {
                                const filtered = RED.nodes.filterNodes({ type: configType });
                                if (Array.isArray(filtered)) {
                                    filtered.forEach(function (cfg) {
                                        configs.push(cfg);
                                    });
                                }
                            } catch (error) {
                            }
                        }
                    }
                } catch (error) {
                }
                return configs;
            }

            function ensureDefaultServerSelection() {
                // Auto-select the first available config only for empty nodes.
                // Existing saved nodes must keep their original connection.
                const currentValue = String($server.val() || node.server || "").trim();
                if (currentValue !== "" && currentValue !== "_ADD_") {
                    return;
                }

                const configs = getConfigNodesByType("unifi-protect-config");
                if (!Array.isArray(configs) || configs.length === 0) {
                    return;
                }

                const firstConfigId = String(configs[0].id || "").trim();
                if (!firstConfigId) {
                    return;
                }

                $server.val(firstConfigId);
            }

            function makeSelectSearchable($select, placeholder) {
                if (!$select || $select.length === 0) {
                    return;
                }
                const selectId = String($select.attr("id") || "").trim();
                if (!selectId) {
                    return;
                }

                const searchId = selectId + "-search";
                $select.off(".unifiSearchable");
                $select.removeData("unifi-searchable");
                $select.removeData("unifi-options-count");
                $select.show();

                if ($select.is("select[multiple]")) {
                    return;
                }

                const $existingSearchInput = $("#" + searchId);
                if ($existingSearchInput.length > 0) {
                    try {
                        if ($existingSearchInput.data("ui-autocomplete")) {
                            $existingSearchInput.autocomplete("destroy");
                        }
                    } catch (error) {
                    }
                    $existingSearchInput.off(".unifiSearchable");
                    $existingSearchInput.remove();
                }

                const $searchInput = $("<input>")
                    .attr("id", searchId)
                    .attr("type", "search")
                    .attr("autocomplete", "off")
                    .attr("placeholder", String(placeholder || "Search"))
                    .addClass("red-ui-input")
                    .css({
                        width: $select.css("width") || "100%",
                        marginBottom: "6px"
                    });
                $select.before($searchInput);
                $select.hide();

                const options = $select.find("option").map(function () {
                    const $option = $(this);
                    const optionValue = String($option.val() || "").trim();
                    const optionText = String($option.text() || "").trim();
                    return {
                        value: optionValue,
                        text: optionText,
                        isPlaceholder: optionValue === "",
                        searchable: [
                            optionText,
                            String($option.attr("data-device-name") || "").trim(),
                            String($option.attr("data-client-name") || "").trim(),
                            optionValue
                        ].filter(Boolean).join(" ").toLowerCase()
                    };
                }).get();

                function findOptionByValue(value) {
                    return options.find(function (option) {
                        return String(option.value) === String(value || "").trim();
                    });
                }

                function syncInputFromSelect() {
                    const selectedValue = String($select.val() || "").trim();
                    const selected = findOptionByValue(selectedValue);
                    if (selected && !selected.isPlaceholder) {
                        $searchInput.val(selected.text);
                    } else {
                        $searchInput.val("");
                    }
                }

                function setSelectedValue(value, triggerChange) {
                    const selected = findOptionByValue(value);
                    if (selected) {
                        $select.val(selected.value);
                    } else {
                        $select.val("");
                    }
                    syncInputFromSelect();
                    if (triggerChange) {
                        $select.trigger("change");
                    }
                }

                let filterOnKeyUpOnly = false;
                $searchInput.autocomplete({
                    minLength: 0,
                    source: function (request, response) {
                        const term = filterOnKeyUpOnly
                            ? String(request && request.term || "").trim().toLowerCase()
                            : "";
                        const items = options
                            .filter(function (option) {
                                if (option.isPlaceholder) {
                                    return false;
                                }
                                if (!term) {
                                    return true;
                                }
                                return option.searchable.indexOf(term) !== -1;
                            })
                            .map(function (option) {
                                return {
                                    label: option.text,
                                    value: option.text,
                                    optionValue: option.value
                                };
                            });

                        if (items.length === 0) {
                            response([{
                                label: "No results",
                                value: "",
                                optionValue: "",
                                noSelection: true
                            }]);
                            return;
                        }

                        response(items);
                    },
                    select: function (event, ui) {
                        if (ui.item && ui.item.noSelection) {
                            event.preventDefault();
                            return false;
                        }
                        if (ui.item) {
                            $select.data("unifi-user-selection", true);
                            setSelectedValue(ui.item.optionValue, true);
                        }
                        return true;
                    },
                    change: function (event, ui) {
                        if (ui.item) {
                            return;
                        }
                        const typed = String($searchInput.val() || "").trim().toLowerCase();
                        if (!typed) {
                            setSelectedValue("", true);
                            return;
                        }

                        const exactMatch = options.find(function (option) {
                            if (option.isPlaceholder) {
                                return false;
                            }
                            return option.text.toLowerCase() === typed || option.value.toLowerCase() === typed;
                        });

                        if (exactMatch) {
                            setSelectedValue(exactMatch.value, true);
                        } else {
                            syncInputFromSelect();
                        }
                    }
                });

                $searchInput.on("keyup.unifiSearchable", function () {
                    filterOnKeyUpOnly = true;
                    $(this).autocomplete("search", $(this).val());
                });
                $searchInput.on("mouseup.unifiSearchable", function () {
                    const $input = $(this);
                    filterOnKeyUpOnly = false;
                    setTimeout(function () {
                        $input.autocomplete("search", "");
                    }, 0);
                });

                syncInputFromSelect();
                $select.data("unifi-searchable", true);
                $select.data("unifi-options-count", options.length);
            }

            function syncCapabilityConfigFromInputs() {
                $capabilityConfigContainer.find("[id^='node-input-capability-config-']").each(function () {
                    const $field = $(this);
                    const fieldId = String($field.attr("id") || "").replace("node-input-capability-config-", "");
                    if (!fieldId) {
                        return;
                    }

                    if ($field.is(":checkbox")) {
                        capabilityConfig[fieldId] = $field.is(":checked");
                        return;
                    }

                    if ($field.is("select[multiple]")) {
                        capabilityConfig[fieldId] = $field.val() || [];
                        return;
                    }

                    capabilityConfig[fieldId] = $field.val();
                });

                writeCapabilityConfig();
            }

            function getSelectedDeviceName() {
                const $selected = $deviceId.find("option:selected");
                return String($selected.data("deviceName") || "").trim();
            }

            function getSelectedDeviceTypeLabel() {
                const selectedType = getCurrentOrNodeValue($deviceType, node.deviceType, "");
                const match = deviceTypeDefinitions.find(function (item) {
                    return item.type === selectedType;
                });
                return match ? String(match.label || "").trim() : "";
            }

            function getSelectedCapabilityDefinition() {
                const selectedCapability = getCurrentOrNodeValue($capability, node.capability, "observe");
                return capabilityDefinitions.find(function (item) {
                    return item.id === selectedCapability;
                }) || null;
            }

            function buildSelectionSummary(capabilityLabel, deviceName) {
                const normalizedLabel = String(capabilityLabel || "").trim();
                const normalizedDeviceName = String(deviceName || "").trim();

                if (!normalizedLabel || !normalizedDeviceName) {
                    return "";
                }

                if (normalizedLabel === "Receive Events") {
                    return "Listening for live events from " + normalizedDeviceName + ".";
                }

                if (normalizedLabel === "Read Device State") {
                    return "Reading the current state of " + normalizedDeviceName + ".";
                }

                if (normalizedLabel === "Take Snapshot") {
                    return "Taking a snapshot from " + normalizedDeviceName + ".";
                }

                if (normalizedLabel === "Read Application Info") {
                    return "Reading Protect application information.";
                }

                return normalizedLabel + " on " + normalizedDeviceName + ".";
            }

            function refreshSelectionSummary() {
                const selectedServer = String($server.val() || "").trim();
                const deviceTypeLabel = getSelectedDeviceTypeLabel();
                const deviceName = getSelectedDeviceName();
                const capabilityDefinition = getSelectedCapabilityDefinition();
                let summary = "Choose a connection to begin.";
                let detail = "The editor only shows actions supported by the selected UniFi Protect device.";

                if (selectedServer && selectedServer !== "_ADD_") {
                    summary = "Choose what you want to control.";
                    detail = "Start with a device type, then pick a device and an action.";
                }

                if (deviceTypeLabel) {
                    summary = "Choose the " + deviceTypeLabel.toLowerCase() + " you want to use.";
                    detail = "Only compatible UniFi Protect devices from this category will be shown.";
                }

                if (deviceName) {
                    summary = "Choose what you want to do with " + deviceName + ".";
                    detail = "Only actions supported by this device are listed.";
                }

                if (capabilityDefinition && deviceName) {
                    summary = buildSelectionSummary(capabilityDefinition.label, deviceName);
                    detail = capabilityDefinition.description || detail;
                } else if (capabilityDefinition && capabilityDefinition.description) {
                    detail = capabilityDefinition.description;
                }
                syncProgressiveRows();
            }

            function syncNameFromSelection() {
                const selectedDeviceName = getSelectedDeviceName();

                if (!selectedDeviceName) {
                    return;
                }

                $name.val(selectedDeviceName);
            }

            function rememberSelectedDeviceName() {
                const selectedDeviceName = getSelectedDeviceName();
                if (!selectedDeviceName) {
                    return;
                }
                $deviceName.val(selectedDeviceName);
            }

            function clearDeviceSelection() {
                preserveSavedDeviceSelection = false;
                deviceListRequestId += 1;
                capabilityListRequestId += 1;
                capabilityOptionsRequestId += 1;
                $deviceName.val("");
                renderDevices([]);
                renderCapabilities([]);
                renderCapabilityOptions({ fields: [] }, { clearStoredConfig: false });
            }

            function renderDeviceTypes(items) {
                deviceTypeDefinitions = Array.isArray(items) ? items.slice() : [];
                const currentValue = getCurrentOrNodeValue($deviceType, node.deviceType, "");
                withSuppressedChanges(function () {
                    $deviceType.empty();
                    $deviceType.append($("<option></option>").val("").text("Choose what to control"));

                    items.forEach(function (item) {
                        $deviceType.append(
                            $("<option></option>")
                                .val(item.type)
                                .text(item.label)
                        );
                    });

                    if (currentValue && $deviceType.find("option[value='" + currentValue + "']").length > 0) {
                        $deviceType.val(currentValue);
                    } else {
                        $deviceType.val("");
                    }
                });
                refreshSelectionSummary();
            }

            function renderCapabilities(items) {
                capabilityDefinitions = Array.isArray(items) ? items.slice() : [];
                const currentValue = getCurrentOrNodeValue($capability, node.capability, "observe");
                withSuppressedChanges(function () {
                    $capability.empty();

                    items.forEach(function (item) {
                        $capability.append(
                            $("<option></option>")
                                .val(item.id)
                                .attr("data-method", String(item.method || "").trim())
                                .attr("data-opens-stream", item.opensEventStream === true ? "true" : "false")
                                .text(item.label)
                        );
                    });

                    if (currentValue && $capability.find("option[value='" + currentValue + "']").length > 0) {
                        $capability.val(currentValue);
                    } else if ($capability.find("option[value='observe']").length > 0) {
                        $capability.val("observe");
                    }
                });
                refreshSelectionSummary();
            }

            function normalizeFieldValue(field, rawValue) {
                if (rawValue === undefined || rawValue === null) {
                    if (field.multiple) {
                        return [];
                    }
                    return field.defaultValue !== undefined ? field.defaultValue : "";
                }
                if (field.type === "checkbox") {
                    return rawValue === true || rawValue === "true";
                }
                if (field.multiple) {
                    return Array.isArray(rawValue) ? rawValue.map(String) : [String(rawValue)];
                }
                return String(rawValue).trim();
            }

            function resolveSelectValue(field, normalizedValue) {
                const optionValues = Array.isArray(field.options)
                    ? field.options.map(function (option) {
                        return String(option.value);
                    })
                    : [];

                if (field.multiple) {
                    const selectedValues = Array.isArray(normalizedValue) ? normalizedValue.map(String) : [];
                    const matchingValues = selectedValues.filter(function (value) {
                        return optionValues.indexOf(value) !== -1;
                    });
                    if (matchingValues.length > 0) {
                        return matchingValues;
                    }
                    if (Array.isArray(field.defaultValue)) {
                        return field.defaultValue.map(String).filter(function (value) {
                            return optionValues.indexOf(value) !== -1;
                        });
                    }
                    return [];
                }

                if (optionValues.indexOf(String(normalizedValue)) !== -1) {
                    return String(normalizedValue);
                }

                if (field.defaultValue !== undefined && field.defaultValue !== null) {
                    const fallbackValue = String(field.defaultValue).trim();
                    if (optionValues.indexOf(fallbackValue) !== -1) {
                        return fallbackValue;
                    }
                }

                if (field.allowEmpty) {
                    return "";
                }

                return optionValues.length > 0 ? optionValues[0] : "";
            }

            function applySelectValue($input, field, resolvedValue) {
                const selectedValues = field.multiple
                    ? (Array.isArray(resolvedValue) ? resolvedValue.map(String) : [])
                    : [String(resolvedValue)];

                $input.find("option").each(function () {
                    const $option = $(this);
                    const optionValue = String($option.val());
                    $option.prop("selected", selectedValues.indexOf(optionValue) !== -1);
                });

                if (field.multiple) {
                    $input.val(selectedValues);
                } else {
                    $input.val(selectedValues.length > 0 ? selectedValues[0] : "");
                    const selectedIndex = $input.find("option").toArray().findIndex(function (option) {
                        return String(option.value) === String(selectedValues.length > 0 ? selectedValues[0] : "");
                    });
                    if (selectedIndex >= 0 && $input.get(0)) {
                        $input.get(0).selectedIndex = selectedIndex;
                    }
                }
            }

            function restoreRenderedFieldValues(fields) {
                const liveCapabilityConfig = parseCapabilityConfig($capabilityConfig.val());

                (fields || []).forEach(function (field) {
                    if (field.type !== "select") {
                        return;
                    }

                    const $input = $("#node-input-capability-config-" + field.id);
                    if ($input.length === 0) {
                        return;
                    }

                    const currentValue = Object.prototype.hasOwnProperty.call(liveCapabilityConfig, field.id)
                        ? liveCapabilityConfig[field.id]
                        : undefined;
                    const normalizedValue = normalizeFieldValue(field, currentValue);
                    const resolvedValue = resolveSelectValue(field, normalizedValue);
                    applySelectValue($input, field, resolvedValue);
                });
            }

            function renderCapabilityOptions(data, options) {
                const renderOptions = options || {};
                const fields = data && Array.isArray(data.fields) ? data.fields : [];
                const $requirements = $("#node-capability-requirements").empty();
                const requirements = data && Array.isArray(data.requirements) ? data.requirements : [];
                requirements.forEach(function (text) { $("<p></p>").text(text).appendTo($requirements); });
                $requirements.toggle(requirements.length > 0);
                syncCapabilityConfigFromInputs();
                $capabilityConfigContainer.empty();

                if (fields.length === 0) {
                    $capabilityConfigRow.data("has-fields", false);
                    $capabilityConfigRow.hide();
                    if (renderOptions.clearStoredConfig) {
                        capabilityConfig = {};
                        writeCapabilityConfig();
                    }
                    $capabilityConfigContainer.empty();
                    refreshSelectionSummary();
                    return;
                }

                if (renderOptions.clearStoredConfig) {
                    capabilityConfig = {};
                    writeCapabilityConfig();
                }

                $capabilityConfigRow.data("has-fields", true);
                $capabilityConfigRow.show();
                fields.forEach(function (field) {
                    const fieldId = "node-input-capability-config-" + field.id;
                    const $wrapper = $("<div></div>").css("margin-bottom", "8px");
                    const isHiddenField = field.type === "hidden";
                    const $label = $("<label></label>")
                        .attr("for", fieldId)
                        .css({ width: "140px", marginRight: "12px", display: "inline-block" })
                        .text(field.label || field.id);
                    let $input;

                    if (field.type === "select") {
                        $input = $("<select></select>").attr("id", fieldId).css("width", "calc(100% - 160px)");
                        if (field.multiple) {
                            $input.attr("multiple", "multiple").css("min-height", "88px");
                        }
                        if (field.placeholder && !field.allowEmpty) {
                            $input.append($("<option></option>").val("").text(field.placeholder));
                        }
                        (field.options || []).forEach(function (option) {
                            $input.append(
                                $("<option></option>")
                                    .val(option.value)
                                    .text(option.label)
                            );
                        });
                    } else if (field.type === "checkbox") {
                        $input = $("<input>").attr({ id: fieldId, type: "checkbox" });
                    } else if (field.type === "textarea") {
                        $input = $("<textarea></textarea>").attr({ id: fieldId, rows: 4, placeholder: field.placeholder || "" }).css("width", "calc(100% - 160px)");
                    } else if (field.type === "hidden") {
                        $input = $("<input>").attr({ id: fieldId, type: "hidden" });
                    } else {
                        $input = $("<input>").attr({
                            id: fieldId,
                            type: field.type === "number" ? "number" : "text",
                            placeholder: field.placeholder || ""
                        }).css("width", "calc(100% - 160px)");
                    }

                    if (field.type === "number") {
                        if (field.min !== undefined) $input.attr("min", field.min);
                        if (field.max !== undefined) $input.attr("max", field.max);
                        $input.attr("step", field.id === "hours" ? "any" : "1");
                    }
                    const currentValue = Object.prototype.hasOwnProperty.call(capabilityConfig, field.id)
                        ? capabilityConfig[field.id]
                        : undefined;
                    const normalizedValue = normalizeFieldValue(field, currentValue);
                    const resolvedValue = field.type === "select"
                        ? resolveSelectValue(field, normalizedValue)
                        : normalizedValue;
                    if (!Object.prototype.hasOwnProperty.call(capabilityConfig, field.id) || field.type === "select") {
                        capabilityConfig[field.id] = resolvedValue;
                    }
                    if (field.type === "checkbox") {
                        $input.prop("checked", resolvedValue === true);
                    } else if (field.type === "hidden") {
                        $input.val(resolvedValue);
                    } else if (field.type === "select") {
                        applySelectValue($input, field, resolvedValue);
                    } else {
                        $input.val(resolvedValue);
                    }

                    $input.on("change input", function () {
                        if (field.type === "checkbox") {
                            capabilityConfig[field.id] = $(this).is(":checked");
                        } else if (field.multiple) {
                            capabilityConfig[field.id] = $(this).val() || [];
                        } else {
                            capabilityConfig[field.id] = $(this).val();
                        }

                        if (field.reloadOnChange && field.id === "propertyPath") {
                            delete capabilityConfig.propertyValue;
                            delete capabilityConfig.valueType;
                        }
                        if (field.reloadOnChange && field.id === "observable") {
                            delete capabilityConfig.observableScopeId;
                        }

                        writeCapabilityConfig();

                        if (field.reloadOnChange) {
                            syncCapabilityConfigFromInputs();
                            loadCapabilityOptions();
                        }
                    });

                    if (isHiddenField) {
                        $wrapper.append($input);
                    } else {
                        $wrapper.append($label).append($input);
                        if (field.tip) {
                            const tipId = fieldId + "-tip";
                            $input.attr("aria-describedby", tipId);
                            $("<p></p>").attr({ id: tipId, class: "unifi-ultimate-tip" })
                                .css("margin-left", "152px").text(field.tip).appendTo($wrapper);
                        }
                    }

                    $capabilityConfigContainer.append($wrapper);
                });

                writeCapabilityConfig();
                restoreRenderedFieldValues(fields);
                setTimeout(function () {
                    restoreRenderedFieldValues(fields);
                }, 0);
                refreshSelectionSummary();
            }

            function renderDevices(items) {
                const savedDeviceId = preserveSavedDeviceSelection ? node.deviceId : "";
                const currentValue = getCurrentOrNodeValue($deviceId, savedDeviceId, "");
                withSuppressedChanges(function () {
                    $deviceId.empty();
                    $deviceId.append($("<option></option>").val("").text("Choose a device"));

                    items.forEach(function (item) {
                        const labelParts = [item.name || item.id];
                        if (item.state) {
                            labelParts.push("[" + item.state + "]");
                        }
                        $deviceId.append(
                            $("<option></option>")
                                .val(item.id)
                                .text(labelParts.join(" "))
                                .attr("data-device-name", item.name || item.id)
                        );
                    });

                    const hasCurrentValue = currentValue && $deviceId.find("option").filter(function () {
                        return String($(this).val() || "") === currentValue;
                    }).length > 0;
                    if (hasCurrentValue) {
                        $deviceId.val(currentValue);
                    } else if (currentValue) {
                        const savedName = String(node.deviceName || currentValue).trim();
                        $deviceId.append(
                            $("<option></option>")
                                .val(currentValue)
                                .text(savedName + " (saved; currently unavailable)")
                                .attr("data-device-name", savedName)
                                .attr("data-unavailable", "true")
                        );
                        $deviceId.val(currentValue);
                    } else {
                        $deviceId.val("");
                    }
                });

                makeSelectSearchable($deviceId, "Search devices");
                rememberSelectedDeviceName();
                refreshSelectionSummary();
            }

            function loadCapabilities() {
                const requestId = ++capabilityListRequestId;
                const serverId = String($server.val() || "").trim();
                const selectedType = String($deviceType.val() || "").trim() || String(node.deviceType || "").trim();
                const selectedDeviceId = String($deviceId.val() || "").trim();
                if (!selectedType) {
                    renderCapabilities([]);
                    renderCapabilityOptions({ fields: [] }, { clearStoredConfig: false });
                    return Promise.resolve();
                }

                let requestUrl = "unifiProtect/device-capabilities?deviceType=" + encodeURIComponent(selectedType);
                if (serverId && serverId !== "_ADD_" && selectedDeviceId) {
                    requestUrl += "&serverId=" + encodeURIComponent(serverId) + "&deviceId=" + encodeURIComponent(selectedDeviceId);
                }

                return requestJson(requestUrl)
                    .then(function (data) {
                        if (requestId !== capabilityListRequestId) {
                            return;
                        }
                        renderCapabilities(Array.isArray(data) ? data : []);
                    })
                    .catch(function (xhr) {
                        if (requestId !== capabilityListRequestId) {
                            return;
                        }
                        renderCapabilities([]);
                        renderCapabilityOptions({ fields: [] }, { clearStoredConfig: false });
                        const errorText = xhr && xhr.responseJSON && xhr.responseJSON.error ? xhr.responseJSON.error : "Unable to load capabilities";
                        RED.notify(errorText, "error");
                    });
            }

            function loadCapabilityOptions() {
                const requestId = ++capabilityOptionsRequestId;
                const serverId = $server.val();
                const currentDeviceType = String($deviceType.val() || "").trim() || String(node.deviceType || "").trim();
                const currentDeviceId = String($deviceId.val() || "").trim();
                const currentCapability = String($capability.val() || "").trim() || String(node.capability || "observe").trim();
                if (!serverId || serverId === "_ADD_" || !currentDeviceType || !currentCapability) {
                    renderCapabilityOptions({ fields: [] }, { clearStoredConfig: false });
                    return Promise.resolve();
                }

                return requestJson(
                    "unifiProtect/device-capability-options?serverId=" + encodeURIComponent(serverId) +
                    "&deviceType=" + encodeURIComponent(currentDeviceType) +
                    "&deviceId=" + encodeURIComponent(currentDeviceId || "") +
                    "&capability=" + encodeURIComponent(currentCapability) +
                    "&capabilityConfig=" + encodeURIComponent(JSON.stringify(capabilityConfig || {}))
                ).then(function (data) {
                    if (requestId !== capabilityOptionsRequestId) {
                        return;
                    }
                    renderCapabilityOptions(data || { fields: [] });
                }).catch(function (xhr) {
                    if (requestId !== capabilityOptionsRequestId) {
                        return;
                    }
                    renderCapabilityOptions({ fields: [] }, { clearStoredConfig: false });
                    const errorText = xhr && xhr.responseJSON && xhr.responseJSON.error ? xhr.responseJSON.error : "Unable to load capability options";
                    RED.notify(errorText, "error");
                });
            }

            function loadDevices() {
                const requestId = ++deviceListRequestId;
                const serverId = $server.val();
                const selectedType = getCurrentOrNodeValue($deviceType, node.deviceType, "");
                if (!serverId || serverId === "_ADD_" || !selectedType) {
                    renderDevices([]);
                    renderCapabilityOptions({ fields: [] }, { clearStoredConfig: false });
                    return Promise.resolve();
                }

                $refresh.find("i").addClass("fa-spin");
                return requestJson(
                    "unifiProtect/devices?serverId=" + encodeURIComponent(serverId) + "&deviceType=" + encodeURIComponent(selectedType)
                ).then(function (data) {
                    if (requestId !== deviceListRequestId) {
                        return;
                    }
                    renderDevices(Array.isArray(data) ? data : []);
                }).catch(function (xhr) {
                    if (requestId !== deviceListRequestId) {
                        return;
                    }
                    renderDevices([]);
                    renderCapabilityOptions({ fields: [] }, { clearStoredConfig: false });
                    const errorText = xhr && xhr.responseJSON && xhr.responseJSON.error ? xhr.responseJSON.error : "Unable to load devices";
                    RED.notify(errorText, "error");
                }).finally(function () {
                    if (requestId === deviceListRequestId) {
                        $refresh.find("i").removeClass("fa-spin");
                    }
                });
            }

            function loadDeviceTypes() {
                return requestJson("unifiProtect/device-types")
                    .then(function (data) {
                        renderDeviceTypes(Array.isArray(data) ? data : []);
                    })
                    .catch(function (xhr) {
                        renderDeviceTypes([]);
                        renderCapabilities([]);
                        renderDevices([]);
                        renderCapabilityOptions({ fields: [] }, { clearStoredConfig: false });
                        const errorText = xhr && xhr.responseJSON && xhr.responseJSON.error ? xhr.responseJSON.error : "Unable to load device types";
                        RED.notify(errorText, "error");
                    });
            }

            function refreshEditor() {
                // Protect editor dependencies are hierarchical: device types
                // first, then devices, then capabilities, then capability options.
                return loadDeviceTypes()
                    .then(function () {
                        return loadDevices();
                    })
                    .then(function () {
                        return loadCapabilities();
                    })
                    .then(function () {
                        return loadCapabilityOptions();
                    })
                    .finally(function () {
                        isInitializingEditor = false;
                    });
            }

            function refreshAfterServerChange() {
                return loadDevices()
                    .then(function () {
                        return loadCapabilities();
                    })
                    .then(function () {
                        return loadCapabilityOptions();
                    });
            }

            function refreshAfterTypeChange() {
                return loadDevices()
                    .then(function () {
                        return loadCapabilities();
                    })
                    .then(function () {
                        return loadCapabilityOptions();
                    });
            }

            function refreshAfterDeviceChange() {
                return loadCapabilities()
                    .then(function () {
                        return loadCapabilityOptions();
                    });
            }

            function refreshAfterCapabilityChange() {
                return loadCapabilityOptions();
            }

            try {
                RED.sidebar.show("help");
            } catch (error) {
            }

            writeCapabilityConfig();
            makeSelectSearchable($deviceId, "Search devices");

            $server.on("change", function () {
                if (suspendChangeHandling || isInitializingEditor) {
                    return;
                }
                refreshAfterServerChange();
            });
            $deviceType.on("change", function () {
                if (suspendChangeHandling || isInitializingEditor) {
                    return;
                }
                clearDeviceSelection();
                capabilityConfig = {};
                writeCapabilityConfig();
                refreshAfterTypeChange();
            });
            $deviceId.on("change", function () {
                if (suspendChangeHandling || isInitializingEditor) {
                    return;
                }
                rememberSelectedDeviceName();
                const isUserSelection = $deviceId.data("unifi-user-selection") === true;
                $deviceId.removeData("unifi-user-selection");
                if (isUserSelection) {
                    syncNameFromSelection();
                }
                capabilityConfig = {};
                writeCapabilityConfig();
                refreshAfterDeviceChange();
            });
            $capability.on("change", function () {
                if (suspendChangeHandling || isInitializingEditor) {
                    return;
                }
                capabilityConfig = {};
                writeCapabilityConfig();
                refreshAfterCapabilityChange();
            });
            $autoEmit.on("change", function () {
                syncProgressiveRows();
            });
            $refresh.on("click", function (event) {
                event.preventDefault();
                refreshAfterServerChange();
            });

            refreshSelectionSummary();
            renderDevices([]);
            ensureDefaultServerSelection();
            refreshEditor();
        }
    });
</script>

<script type="text/html" data-help-name="unifi-protect-device">
    <p><b>Emit startup states and undefined payloads</b> is disabled by default, including in existing flows. Enable it to emit the initial device state and readings with a missing, null or undefined payload. Otherwise these messages are suppressed; false and zero remain valid values. Missing readings never replay a previous value.</p>
    <p><a href="https://youtube.com/playlist?list=PL9Yh1bjbLAYrWKtMlopN0swuQXbdJ8MFJ&si=4MmW1nNTCLrJtEHv" target="_blank" rel="noopener noreferrer"><img src="resources/node-red-contrib-unifi-ultimate/logos/youtube-icon.svg" alt="YouTube" width="24" height="18" style="vertical-align:text-bottom; margin-right:6px;">Youtube Tutorials</a></p>

    <p>Use this node to execute a configured UniFi Protect action or listen for live Protect events.</p>

    <h3>Configuration</h3>
    <p><b>Connection</b> selects the shared UniFi Protect config node.</p>
    <p><b>Control</b> chooses the Protect device category. <b>Device</b> chooses the specific item. Device selectors are searchable and open with the complete list before filtering. A saved selection that is temporarily unavailable is preserved instead of being cleared.</p>
    <p><b>Action</b> only shows actions supported by the selected device.</p>
    <p>Additional fields appear only when the selected action needs extra input. For example, events, PTZ presets, live views, or discovered properties.</p>
    <p>Action highlights: <code>Receive Events</code>, <code>Read Device State</code>, <code>Take Snapshot</code>, <code>Show Doorbell Message</code>, siren play/stop/test, relay output control, speaker sound test, and application/alarm actions on <code>NVR</code>.</p>
    <p>Protect resources include cameras, sensors, lights, chimes, viewers, live views, NVRs, bridges, Link Stations, alarm hubs, key fobs, relays, sirens, and speakers. The newer device families expose read state and events without the generic raw-update action.</p>
    <p><code>Play Siren</code> uses a duration in seconds. <code>Control Relay Output</code> requires an explicit output and on/off state; auto-off applies only when turning an output on. <code>Trigger Alarm Hub Output</code> can toggle an output or set it on/off, with an optional delay and duration. Sound-test actions use a configured volume and never read control values from the incoming message.</p>
    <p>Protect alarm arming is application-wide, so its actions are available under <code>NVR</code>, not on an individual Alarm Hub. Use <code>Read Arm Profiles</code>, <code>Select Arm Profile</code>, <code>Arm Alarm</code>, and <code>Disarm Alarm</code>. These endpoints require Protect's local Alarm Manager.</p>
    <p><code>Receive Events</code> performs an initial fetch and then subscribes to streams managed by the shared Protect config node. The config node keeps websocket channels and forwards matching updates to runtime nodes. In this mode, the input pin is hidden and listening starts automatically after deploy/restart.</p>
    <p>For <code>Sensor</code>, <code>Camera</code>, <code>Light</code>, <code>Key Fob</code>, <code>Relay</code>, and <code>Alarm Hub</code> observables, <code>All</code> emits every event for the selected device. Choosing a specific observable normalizes the main output to a derived value and keeps the original context in <code>msg.details.raw</code>. Event observables emit <code>true/false</code>; sensor metrics such as <code>Temperature</code>, <code>Humidity</code>, <code>Light Level</code>, and <code>Battery Level</code> emit numeric values. <code>License Plate (LPR)</code> emits recognized plate text.</p>
    <p>For <code>Key Fob</code>, the event list includes <code>Arm (1)</code>, <code>Night (2)</code>, <code>Disarm (3)</code>, <code>Panic (4)</code>, <code>Left</code>, and <code>Right</code>. The two side buttons have no printed number. Selecting one emits <code>true</code> only for that button; the original <code>sensorButtonPressed</code> event remains available in <code>msg.details.raw</code>.</p>
    <p>The event list also covers the official Protect event families for NFC and fingerprint scans on supported cameras; vape, smoke/CO health, and button events on sensors; relay input changes; and Alarm Hub motion, entry, smoke, glass-break, emergency-button, tamper, relay, and battery events. Resource families without a granular official event type retain only <code>All</code>.</p>
    <p>To read plates, select <code>Camera</code> &rarr; <code>Receive Events</code> &rarr; <code>License Plate (LPR)</code>. Use an LPR-capable camera and enable license plate recognition in Protect. Open the shared <b>Connection</b> and enter its optional <b>Local User</b> and <b>Local Password</b> for a local UniFi OS account that can view the camera's recordings. All Protect nodes using that connection share this account. The official event stream identifies license plate detections but does not include OCR text in its documented schema, so the node retrieves the matching event's metadata through Protect's local, unofficial events API. Compatibility of this lookup depends on the Protect version.</p>
    <p>LPR emits the first available reading immediately, including low-confidence text, as a string such as <code>"AB123CD"</code> in <code>msg.payload</code>, with <code>msg.eventName = "licensePlate"</code>. Text already present in a live event bypasses any outstanding HTTP lookup. Otherwise the node starts looking for OCR as soon as a vehicle is detected, using a prepared local session without waiting for the live LPR classification or for the event to end. Only actual plate metadata is emitted.</p>
    <p>After a detection/update, up to five follow-up reads look for missing or improved OCR, with delays of 150, 350, 750, 1500 and 3000 milliseconds between requests. Corrected text, additional plates and higher confidence for the same text produce another message. Identical readings and lower confidence for previously emitted text are suppressed. The first text still depends on when Protect makes OCR available; a later reading is not a guarantee of accuracy.</p>
    <p>Every reading puts the plate string in <code>msg.payload</code>, including corrections and higher-confidence readings of the same text. <code>msg.details.lpr</code> contains supporting metadata: <code>text</code>, <code>eventId</code>, timestamps, <code>confidence</code> (0&ndash;100, when supplied) and <code>isUpdate</code>, which is true after the first reading of an event. Use <code>eventId</code> to group readings of the same detection. The original event is in <code>msg.details.raw.event</code>. No empty startup value or extra raw-event message is emitted; a new event with the same plate produces a new reading.</p>
    <pre><code>// First available reading
msg.payload = "AB123CE"
msg.details.lpr = { eventId: "event-123", confidence: 35, isUpdate: false }
// Later correction of the same event
msg.payload = "AB123CD"
msg.details.lpr = { eventId: "event-123", confidence: 95, isUpdate: true }
// Higher confidence with unchanged text: another message
msg.payload = "AB123CD"
msg.details.lpr = { eventId: "event-123", confidence: 99, isUpdate: true }</code></pre>
    <p>If OCR metadata is delayed, the node briefly retries the event lookup and processes later live updates. Events without recognized text produce no result. Missing credentials and lookup failures are reported on output 2. Credentials are stored using Node-RED's credential system, separately from flow configuration, and are never included in output messages.</p>
    <p><b>Emit periodically</b> repeats read-only actions at the selected interval and sends each result to the flow. It is hidden for <code>Receive Events</code> and write actions.</p>
    <p>Request timeout is handled automatically by the node.</p>
    <p><b>Name</b> is the node name shown in the editor and is updated only when you manually select a different item from the list.</p>

    <h3>Events with photos</h3>
    <p>Select <b>Camera → Receive Events with Photo</b>, choose a detection filter and deploy. The node emits one message per event with its recorded thumbnail in <code>msg.image</code> (Buffer), its MIME type in <code>msg.imageType</code>, and the detection in <code>msg.payload</code>. It uses the image of that exact event; availability depends on recording retention and permissions. Missing images are reported on output 2. OCR and thumbnails can arrive after the initial detection; the node retries briefly and can retry on later event updates.</p>
    <pre><code>msg.eventName = "detectionWithImage"
msg.payload = { eventId: "event-123", cameraId: "camera-1",
  type: "smartDetectZone", objectTypes: ["person"], plates: [] }
msg.image       // Buffer containing the recorded event image
msg.imageType = "image/jpeg"</code></pre>
    <h3>Recent detections</h3>
    <p>Select <b>Read Recent Detections</b>, choose a filter, a time window (default: 24 hours, maximum: 7 days) and up to 100 results, then connect an Inject node. Each trigger returns an array in <code>msg.payload</code>, newest first as provided by Protect. The time window is recalculated for each trigger. Both this action and event photos require the connection's optional local account with camera/recording read permissions.</p>
    <p><code>msg.details.history</code> contains <code>from</code>, <code>to</code>, <code>hasMore</code>, <code>nextOffset</code> and <code>stoppedReason</code>. The node scans at most 1,000 source rows per trigger. When <code>hasMore</code> is true, the result is incomplete; use <b>History offset</b> to continue. If Protect repeats pages, <code>stoppedReason</code> is <code>repeated-page</code>; increasing the offset cannot guarantee a complete search on that controller. No images are downloaded for a history list.</p>
    <pre><code>msg.eventName = "recentDetections"
msg.payload = [{ eventId: "event-123", cameraId: "camera-1",
  type: "smartDetectZone", objectTypes: ["licensePlate"],
  plates: [{ text: "AB123CD", known: true, name: "Family car" }] }]</code></pre>
    <h3>Optional Known plates</h3>
    <p>For <b>License Plate (LPR)</b>, <b>Receive Events with Photo</b> and <b>Read Recent Detections</b>, the optional <b>Known plates</b> field accepts one <code>PLATE = friendly name</code> per line. Spaces, hyphens and letter case are ignored when matching. Similar characters (such as O and 0) are never guessed. Names are ordinary flow settings and are included in flow exports.</p>
    <pre><code>AB123CD = Family car
XY456ZT = Delivery van</code></pre>
    <p>LPR keeps the recognized text in <code>msg.payload</code> and adds <code>msg.knownPlate</code> (boolean), <code>msg.plateName</code> (only for a match), and <code>known</code>/<code>name</code> in <code>msg.details.lpr</code>. Photo/history detections expose these fields in each <code>plates</code> entry. Unknown plates still produce messages.</p>

    <h3>Input</h3>
    <ul>
        <li>When <code>Receive Events</code> is selected, the input pin is hidden.</li>
        <li>Any incoming message triggers the configured action.</li>
        <li>Input message properties are ignored by this node.</li>
    </ul>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>Output 1 — result</dt>
        <dd>Emits state and live event messages for the selected device. When <code>Receive Events</code> is active, both state and event messages use this pin.</dd>
        <dt class="optional">msg.topic</dt>
        <dd>Node name from the editor.</dd>
        <dt class="optional">msg.deviceName</dt>
        <dd>Remembered/observed name of the selected device.</dd>
        <dt class="optional">msg.eventName</dt>
        <dd>Trigger or event that produced the message.</dd>
        <dt class="optional">msg.details.unifiProtect</dt>
        <dd>Standardized metadata for the device and selected capability.</dd>
        <dt class="optional">msg.details.raw</dt>
        <dd>Raw event or context payload when available.</dd>
        <dt class="optional">msg.details.lpr</dt>
        <dd>Recognized plate text, event id, timestamps and optional OCR confidence for <code>License Plate (LPR)</code>.</dd>
    </dl>
    <dl class="message-properties">
        <dt>Output 2 — error</dt>
        <dd>Emitted when the action fails (API error, timeout, or configuration problem). The node status indicates the problem. Use this output to handle errors; request failures are also forwarded to connected <code>catch</code> nodes.</dd>
        <dt class="optional">msg.payload</dt>
        <dd><code>null</code></dd>
        <dt class="optional">msg.topic</dt>
        <dd>Node name from the editor.</dd>
        <dt class="optional">msg.error.message</dt>
        <dd>Human-readable error description.</dd>
    </dl>
